# nginx for the hello-web UI (deploy/ui.Dockerfile). Only the UI's paths
# reach this server: the ingress sends /auth, /me, /health and /openapi.json
# to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The pod's root filesystem is read-only; these live on the /tmp emptyDir.
    client_body_temp_path /tmp/client_temp;

    # SPA fallback: any path without a file is the app, which routes it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Content-hashed build output never changes under a name.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Browsers must see a new service worker as soon as it is deployed.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
    }
}
