# Sealed 2026-11-11 with kubeseal (controller kube-system/sealed-secrets-controller)
# from the Google OAuth Web client JSON; holds client-id and client-secret.
# Unseal verified once applied: see deploy/dev/README.md step 2.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hello-web-google-oauth
  namespace: hello-web-dev
spec:
  encryptedData:
    client-id: 
    client-secret: 
  template:
    metadata:
      name: hello-web-google-oauth
      namespace: hello-web-dev
