# The hello-web API in dev. The image tag below is a placeholder: the
# deploy-dev step in .woodpecker.yml renders it to the commit's tag in a
# temporary copy and applies that copy on every push to main, so env changes
# here reach the cluster on merge. Do not `kubectl apply` this file by hand
# without setting the image too (README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web-api
  namespace: hello-web-dev
  labels: { app.kubernetes.io/name: hello-web-api, app.kubernetes.io/part-of: hello-web }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: hello-web-api } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hello-web-api, app.kubernetes.io/part-of: hello-web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: 192.168.0.10:30500/hello-web-api:set-by-pipeline
          args: ["serve"]
          env:
            - { name: HELLO_WEB_ADDR, value: ":8080" }
            - { name: HELLO_WEB_LOG_LEVEL, value: debug }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-services, key: postgres-password } }
            # $(POSTGRES_PASSWORD) is expanded by the kubelet from the entry
            # above; the password is hex, so it needs no URL escaping.
            - name: HELLO_WEB_DATABASE_DSN
              value: postgres://hello_web:$(POSTGRES_PASSWORD)@postgres.hello-web-dev.svc.cluster.local:5432/hello_web?sslmode=disable
            - { name: HELLO_WEB_REDIS_ADDR, value: "redis.hello-web-dev.svc.cluster.local:6379" }
            - name: HELLO_WEB_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: dev-services, key: redis-password } }
            # Google OAuth sign-in. The client id and secret come from the
            # hello-web-google-oauth SealedSecret (client-id / client-secret);
            # the secret is read from the environment only, so it never appears
            # in process args or the pod spec. Leaving the id unset disables
            # sign-in (only /health is served). The redirect URI must match one
            # registered with the Google OAuth client (google-oauth-sealed.yaml).
            - name: HELLO_WEB_GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: hello-web-google-oauth, key: client-id } }
            - name: HELLO_WEB_GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: hello-web-google-oauth, key: client-secret } }
            # The global Admin, bootstrapped at startup (core db package): the
            # owner's Google account ID (the OIDC sub), never an email. Empty
            # skips the bootstrap, and then nobody can sign in.
            - { name: HELLO_WEB_ADMIN_SUB, value: "" }
            - { name: HELLO_WEB_GOOGLE_REDIRECT_URI, value: "https://hello-web-dev.immutablesoftware.dev/auth/google/callback" }
            # The example feature's greeting (GET /example/hello). Unset uses its
            # default, "Hello from the example feature".
            # - { name: HELLO_WEB_EXAMPLE_GREETING, value: "Hello" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web-api
  namespace: hello-web-dev
  labels: { app.kubernetes.io/name: hello-web-api, app.kubernetes.io/part-of: hello-web }
spec:
  selector: { app.kubernetes.io/name: hello-web-api }
  ports: [{ name: http, port: 80, targetPort: http }]
