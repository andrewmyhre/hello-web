# Sealed 2026-11-11 with kubeseal (controller kube-system/sealed-secrets-controller).
# Random hex postgres-password and redis-password; the controller unsealed it
# into Secret hello-web-dev/dev-services on apply (verified the same day).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dev-services
  namespace: hello-web-dev
spec:
  encryptedData:
    postgres-password: 
    redis-password: 
  template:
    metadata:
      name: dev-services
      namespace: hello-web-dev
