# The hello-web logs dashboard, loaded by the Grafana sidecar in
# `monitoring` (kube-prometheus-stack), which watches every namespace for
# ConfigMaps labelled grafana_dashboard=1. Apply with:
#   kubectl apply -k deploy/grafana
# The generator keeps the dashboard JSON in one file, hello-web-logs.json.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: hello-web
configMapGenerator:
  - name: hello-web-logs-dashboard
    files:
      - hello-web-logs.json
